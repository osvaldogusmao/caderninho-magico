<title>Caderninho Mágico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a school graph-paper notebook with floating math symbols; worlds are crayon-colored cards; play and warm-up games are big cards with huge tap targets. Single deliberate light look. */
:root{
  --paper:#F3F7FD; --grid:#DCE6F4; --line:#C7D5EA; --card:#FFFFFF;
  --ink:#1E2843; --muted:#56627F;
  --red:#EF476F; --orange:#F7882F; --yellow:#FFC53D; --green:#22A867;
  --teal:#11A89A; --blue:#3A78F2; --purple:#8B5CF6; --pink:#E8559F;
  --ok:#22A867; --bad:#EF476F; --sky1:#BFE3FF; --sky2:#EAF6FF; --dirt:#8A5A34;
  --display:'Fredoka','Baloo 2','Comic Sans MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  color:var(--ink); font-family:var(--body); font-size:16px;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.wrap{max-width:1040px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.screen{animation:enter .35s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* floating symbols behind everything */
.floaty{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.floaty span{position:absolute;bottom:-60px;font-family:var(--display);font-weight:700;opacity:.16;animation:floatup linear infinite}
@keyframes floatup{to{transform:translateY(-120vh) rotate(200deg)}}

.btn{border:0;border-radius:18px;padding:.65em 1.3em;font-family:var(--display);font-weight:600;font-size:1.2rem;
  background:var(--c,var(--blue));color:var(--on,#fff);box-shadow:0 5px 0 rgba(20,30,60,.22);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(20,30,60,.22)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.big{font-size:1.5rem;padding:.6em 1.6em}
.btn.wiggle{animation:wiggle 2.2s ease-in-out infinite}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
.iconbtn{width:52px;height:52px;border-radius:50%;border:0;background:var(--card);box-shadow:0 4px 0 var(--line);font-size:1.4rem;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.iconbtn.off{opacity:.5}

/* ---------- Characters ---------- */
.char{display:block;width:100%;height:auto;overflow:visible}
.glow{filter:drop-shadow(0 0 4px currentColor)}
.bob{animation:bob 2.4s ease-in-out infinite}
.dance{animation:dance .6s ease-in-out infinite alternate}
.jump{animation:jump .6s ease-out}
.shake{animation:shake .4s}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes dance{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-12px)}}
@keyframes jump{30%{transform:translateY(-26px) scale(1.06)}60%{transform:translateY(0) scale(.97,1.03)}}

/* ---------- Home ---------- */
.home{display:grid;gap:20px;justify-items:center;text-align:center;padding-top:4px}
.logo{font-size:clamp(2.4rem,7.5vw,3.8rem);font-weight:700;line-height:1;letter-spacing:.5px}
.logo span{display:inline-block;animation:letter 2.8s ease-in-out infinite}
.logo .l1{color:var(--purple)} .logo .l2{color:var(--pink)}
@keyframes letter{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-8px) rotate(-3deg)}}
.tag{color:var(--muted);font-weight:700;max-width:40ch;margin:0}
.step{display:grid;gap:10px;justify-items:center;width:100%}
.steplabel{font-family:var(--display);font-size:1.3rem;font-weight:600}
.namebox input{font-family:var(--display);font-size:1.5rem;padding:.4em .7em;border-radius:16px;border:3px solid var(--line);width:min(320px,100%);text-align:center;background:var(--card);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:0;border-radius:999px;padding:.5em 1.05em;font-family:var(--display);font-weight:600;font-size:1.05rem;background:var(--card);box-shadow:0 4px 0 var(--line);transition:transform .1s}
.chip[aria-pressed="true"]{background:var(--purple);color:#fff;box-shadow:0 4px 0 #5B3AB8;transform:translateY(-2px)}
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;max-width:100%;scrollbar-width:none}
.chiprow .chip{flex:none}
.squad{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;width:100%;max-width:900px}
.mate{border:4px solid transparent;background:var(--card);border-radius:22px;padding:10px 6px 8px;box-shadow:0 5px 0 var(--line);display:grid;gap:4px;justify-items:center;transition:transform .12s}
.mate .pic{width:100%;max-width:104px}
.mate b{font-family:var(--display);font-size:1.02rem;font-weight:600;line-height:1.1}
.mate small{color:var(--muted);font-weight:700;font-size:.76rem;line-height:1.15}
.mate[aria-pressed="true"]{border-color:var(--mc);transform:translateY(-4px);box-shadow:0 9px 0 var(--mc)}
.mate[aria-pressed="true"] .pic{animation:bob 1.6s ease-in-out infinite}
@media (max-width:760px){.squad{grid-template-columns:repeat(3,1fr)}}

/* ---------- Map ---------- */
.maphead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.maphead .buddy{width:84px;flex:none}
.bubble{background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 var(--line);font-family:var(--display);font-size:1.15rem;font-weight:600;position:relative;flex:1;min-width:200px}
.bubble::before{content:"";position:absolute;left:-10px;top:22px;border:10px solid transparent;border-left:0;border-right-color:var(--card)}
.pill{font-family:var(--display);font-weight:600;font-size:1.02rem;border-radius:999px;padding:.35em .9em;white-space:nowrap;background:var(--yellow);color:var(--ink)}
.pill.gem{background:#D9F2FF}
.headtools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gradebar{margin-bottom:12px}
.worlds{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:860px){.worlds{grid-template-columns:repeat(2,1fr)}}
@media (max-width:540px){.worlds{grid-template-columns:1fr}}
.world{background:var(--card);border-radius:24px;padding:14px;box-shadow:0 6px 0 var(--line);display:grid;gap:10px;border-top:10px solid var(--c);animation:rise .45s backwards;animation-delay:calc(var(--i)*45ms)}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.95)}}
.whead{display:flex;align-items:center;gap:10px}
.wicon{font-size:1.9rem;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--card));transition:transform .2s}
.world:hover .wicon{transform:rotate(-10deg) scale(1.1)}
.whead h3{font-size:1.3rem;font-weight:600}
.levels{display:grid;gap:8px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;text-align:left;border:0;border-radius:14px;padding:8px 10px;background:color-mix(in srgb,var(--c) 10%,var(--card));transition:transform .08s}
.lvl:active{transform:scale(.97)}
.lvl .n{font-family:var(--display);font-weight:700;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--on,#fff)}
.lvl .t{font-weight:800;line-height:1.15;min-width:0}
.lvl .t small{display:block;color:var(--muted);font-weight:700;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.stars{font-size:1.05rem;letter-spacing:1px;white-space:nowrap;color:var(--line)}
.stars .on{color:var(--yellow);text-shadow:0 1px 0 #C98A00}

/* ---------- Play ---------- */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.dots{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--card);box-shadow:inset 0 0 0 3px var(--line);transition:transform .2s}
.dots i.done{background:var(--c);box-shadow:none}
.dots i.miss{background:var(--line);box-shadow:none}
.dots i.now{box-shadow:inset 0 0 0 3px var(--c);transform:scale(1.3)}
.stage{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.side{position:-webkit-sticky;position:sticky;top:12px;display:grid;gap:10px;justify-items:center}
.side .buddy{width:130px}
.say{background:var(--card);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 var(--line);font-family:var(--display);font-weight:600;font-size:1rem;text-align:center;min-height:3.2em;position:relative}
.say::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--card)}
.streak{font-family:var(--display);font-weight:700;color:var(--orange);font-size:1.05rem;min-height:1.4em;text-align:center}
.streak.hot{animation:pop .4s}
@media (max-width:700px){
  .stage{grid-template-columns:1fr}
  .side{position:static;grid-template-columns:72px 1fr;justify-items:stretch;align-items:center}
  .side .buddy{width:72px}
  .side .streak{grid-column:1/-1}
  .say{text-align:left}
  .say::before{top:50%;left:-10px;margin:-10px 0 0;border:10px solid transparent;border-left:0;border-right-color:var(--card)}
}
.card{background:var(--card);border-radius:28px;padding:20px clamp(14px,3vw,28px) 24px;box-shadow:0 8px 0 var(--line);display:grid;gap:16px;min-width:0}
.qtag{font-weight:800;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
.prompt{font-size:clamp(1.3rem,3.6vw,1.8rem);font-weight:600;line-height:1.2}
.visual{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:14px;min-height:60px}
.hint{margin:0;color:var(--muted);font-weight:700;text-align:center}
.choices{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:12px}
@media (max-width:560px){.choices.c4{grid-template-columns:repeat(2,1fr)}.choices.c3.txt{grid-template-columns:1fr}.choices.c4.txt{grid-template-columns:1fr 1fr}}
.choice{min-height:84px;border-radius:20px;border:3px solid var(--line);background:var(--card);box-shadow:0 6px 0 var(--line);
  font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,5vw,2.4rem);padding:8px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;transition:transform .08s,background .15s;min-width:0;overflow-wrap:anywhere}
.choice:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.choice:hover{border-color:color-mix(in srgb,var(--c) 50%,var(--line))}
.choices.txt .choice{font-size:clamp(1.02rem,3vw,1.28rem);min-height:68px}
.choice.wide{grid-column:1/-1;font-size:1.3rem;min-height:64px}
.choice.ok{background:var(--ok);border-color:var(--ok);color:#fff;box-shadow:0 6px 0 #17804D;animation:pop .35s}
.choice.bad{background:#FFE3EA;border-color:var(--bad);color:var(--bad);animation:shake .4s}
.choice.reveal{border-color:var(--ok);box-shadow:0 0 0 5px color-mix(in srgb,var(--ok) 35%,transparent),0 6px 0 var(--line)}
.choice:disabled{cursor:default}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.fly{position:fixed;z-index:60;pointer-events:none;font-family:var(--display);font-weight:700;font-size:1.6rem;color:var(--orange);text-shadow:0 2px 0 #fff;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-90px) scale(1.4);opacity:0}}

/* ---------- Visual pieces ---------- */
.objs{display:grid;grid-template-columns:repeat(var(--cols,5),auto);gap:6px 10px;font-size:clamp(1.9rem,6vw,2.6rem);line-height:1.1}
.obj.gone{position:relative;opacity:.35}
.obj.gone::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:5px;margin-top:-2px;background:var(--bad);border-radius:3px;transform:rotate(-35deg)}
.op{font-family:var(--display);font-size:2.6rem;color:var(--c)}
.eq{font-family:var(--display);font-weight:600;font-size:clamp(2rem,8vw,3.4rem);display:flex;gap:.3em;align-items:center;flex-wrap:wrap;justify-content:center;font-variant-numeric:tabular-nums}
.hole{display:inline-grid;place-items:center;min-width:1.4em;padding:0 .2em;border-radius:14px;border:4px dashed var(--c);color:var(--c)}
.groups{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.grp{display:grid;grid-template-columns:repeat(var(--k),auto);gap:2px 4px;padding:6px 8px;border:3px dashed var(--line);border-radius:14px;font-size:1.6rem}
.rods,.cubes{display:flex;gap:6px;align-items:flex-end;flex-wrap:wrap}
.rod{display:grid;grid-template-rows:repeat(10,15px);gap:2px;background:var(--c);padding:3px;border-radius:6px}
.rod i{width:15px;border-radius:50%;background:rgba(255,255,255,.75)}
.cubes{max-width:120px}
.cube{width:21px;height:21px;border-radius:5px;background:var(--orange);box-shadow:inset 0 0 0 3px rgba(255,255,255,.55)}
.pv{display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sq{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,5.5vw,2.3rem);min-width:2.2em;padding:.2em .3em;text-align:center;border-radius:16px;background:color-mix(in srgb,var(--c) 12%,var(--card));font-variant-numeric:tabular-nums}
.sq.hole{background:var(--card)}
.bignum{font-family:var(--display);font-weight:700;font-size:clamp(3rem,13vw,5.4rem);color:var(--c);line-height:1;letter-spacing:.04em;overflow-wrap:anywhere}
.bignum u{text-decoration-thickness:6px;text-underline-offset:8px;color:var(--ink)}
.pairs{display:flex;gap:10px;font-size:2.2rem;flex-wrap:wrap;justify-content:center}
.pairs span{display:grid;gap:4px;align-content:start;padding:4px;border-radius:12px;background:color-mix(in srgb,var(--c) 10%,var(--card))}
.fig{width:min(200px,60vw);height:auto}
.fig.sm{width:72px}
.fig.md{width:min(260px,70vw)}
.fig.wide{width:min(360px,86vw)}
.part{stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.ln{stroke:var(--ink);stroke-width:3;stroke-linecap:round;fill:none}
.hl{stroke:var(--c);stroke-width:5;stroke-linecap:round;fill:none}
.lbl{font-family:var(--display);font-weight:600;fill:var(--ink);text-anchor:middle;font-size:15px}
.frac{display:inline-grid;font-family:var(--display);font-weight:600;line-height:1;text-align:center;font-size:.85em;vertical-align:middle}
.frac span+span{border-top:4px solid currentColor;padding-top:4px;margin-top:4px}
.nl,.ruler{width:100%;max-width:640px;height:auto}
.nl line,.ruler line{stroke:var(--ink);stroke-width:3;stroke-linecap:round}
.nl text,.ruler text{font-family:var(--display);font-weight:600;fill:var(--ink);text-anchor:middle}
.nl .nlhole{fill:var(--card);stroke:var(--c);stroke-width:3;stroke-dasharray:6 4}
.nl .q{fill:var(--c)}
.ruler .rbody{fill:#FFE08A;stroke:#C99B12;stroke-width:2}
.pencils{display:grid;gap:4px;width:100%}
.pencil{height:34px;border-radius:6px 0 0 6px;clip-path:polygon(0 0,calc(100% - 30px) 0,100% 50%,calc(100% - 30px) 100%,0 100%);
  background:linear-gradient(90deg,var(--pc) calc(100% - 30px),#F2C894 calc(100% - 30px),#F2C894 calc(100% - 10px),#333 calc(100% - 10px))}
.choice .pencil{justify-self:start}
.choices.pen .choice{justify-content:flex-start;min-height:64px;padding-inline:14px}
.bag{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:250px;padding:22px 18px 18px;background:#E9D6B4;border:4px solid #B98F57;border-radius:30px 30px 90px 90px;position:relative}
.bag::before{content:"";position:absolute;top:-14px;left:50%;width:80px;margin-left:-40px;height:18px;border-radius:10px;background:#B98F57}
.ball{display:inline-block;width:30px;height:30px;border-radius:50%;box-shadow:inset -5px -5px 0 rgba(0,0,0,.15),inset 4px 4px 0 rgba(255,255,255,.35);vertical-align:middle;flex:none}
.choice .ball{width:34px;height:34px}
.pat{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:clamp(1.9rem,6vw,2.6rem);align-items:center}
.pat .hole{font-family:var(--display);font-size:.8em;min-width:1.5em}
.solids{display:grid;justify-items:center;gap:2px;font-size:1rem}
.stack{display:grid;gap:2px;justify-items:center;font-size:3rem;line-height:1;padding:8px 18px;border-bottom:6px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.listnums{font-family:var(--display);font-weight:600;font-size:clamp(1.5rem,5vw,2.2rem);display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.listnums span{background:color-mix(in srgb,var(--c) 12%,var(--card));border-radius:12px;padding:.1em .45em}
.feedback{min-height:1.6em;text-align:center;font-family:var(--display);font-weight:600;font-size:1.3rem}
.feedback.good{color:var(--ok)} .feedback.oops{color:var(--bad)}

/* ---------- Warm-up games ---------- */
.mghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.goal{font-family:var(--display);font-weight:600;font-size:clamp(1.15rem,3.4vw,1.5rem);flex:1;min-width:200px}
.score{font-family:var(--display);font-weight:700;font-size:1.4rem;background:var(--yellow);border-radius:999px;padding:.15em .8em}
.timer{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--c);transition:width .25s linear}
.arena{position:relative;height:min(60vh,430px);border-radius:24px;overflow:hidden;background:linear-gradient(var(--sky1),var(--sky2));touch-action:manipulation;user-select:none;-webkit-user-select:none}
.arena .cloud{position:absolute;width:120px;height:40px;border-radius:40px;background:rgba(255,255,255,.8);animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(110vw)}}
.balloon{position:absolute;left:0;top:0;width:84px;height:100px;border:0;padding:0;background:transparent;will-change:transform}
.balloon .bb{position:absolute;inset:0 0 14px;border-radius:50% 50% 46% 46%;background:var(--bc);box-shadow:inset -10px -12px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.3);display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:1.25rem;text-shadow:0 2px 0 rgba(0,0,0,.25);padding:4px;line-height:1}
.balloon::after{content:"";position:absolute;left:50%;bottom:0;width:2px;height:16px;background:#7B8099}
.balloon.popped{animation:popb .25s forwards}
.balloon.nope .bb{animation:shake .35s}
@keyframes popb{to{transform:var(--pos) scale(1.6);opacity:0}}
.moles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:560px;width:100%;margin:0 auto;background:linear-gradient(#9AD97E,#6CC25A);padding:16px;border-radius:24px}
.mhole{position:relative;aspect-ratio:1.25;border:0;padding:0;background:transparent;overflow:hidden;border-radius:0 0 50% 50%/0 0 30% 30%}
.mhole::after{content:"";position:absolute;left:4%;right:4%;bottom:0;height:34%;border-radius:50%;background:var(--dirt);box-shadow:inset 0 8px 0 rgba(0,0,0,.25)}
.mole{position:absolute;left:14%;right:14%;bottom:-100%;height:86%;border-radius:50% 50% 40% 40%;background:#B07B4F;transition:bottom .18s ease-out;display:grid;place-items:center;z-index:1}
.mole::before,.mole::after{content:"";position:absolute;top:22%;width:9px;height:11px;border-radius:50%;background:#2A2340}
.mole::before{left:30%}.mole::after{right:30%}
.mole b{margin-top:26%;background:#fff;border-radius:10px;padding:2px 7px;font-family:var(--display);font-weight:700;font-size:clamp(.9rem,3.2vw,1.2rem);color:var(--ink);line-height:1.1}
.mhole.up .mole{bottom:6%}
.mhole.bonk .mole{background:var(--ok)}
.mhole.nope .mole{background:var(--bad)}
.memory{display:grid;grid-template-columns:repeat(var(--mc,4),1fr);gap:10px;max-width:560px;width:100%;margin:0 auto}
.mcard{aspect-ratio:3/3.4;border:0;padding:0;border-radius:16px;background:transparent;perspective:600px}
.mcard .in{display:block;position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .in,.mcard.done .in{transform:rotateY(180deg)}
.mcard .f,.mcard .b{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-family:var(--display);font-weight:700;padding:4px;text-align:center;line-height:1.1}
.mcard .f{background:var(--c);color:#fff;font-size:2rem;box-shadow:0 5px 0 rgba(20,30,60,.2)}
.mcard .b{background:var(--card);transform:rotateY(180deg);box-shadow:inset 0 0 0 3px var(--line);font-size:clamp(.95rem,3.4vw,1.35rem);overflow-wrap:anywhere}
.mcard.done .b{box-shadow:inset 0 0 0 4px var(--ok);background:#E7F8EE}

/* ---------- Result ---------- */
.result{display:grid;justify-items:center;text-align:center;gap:16px;padding-top:10px}
.result .buddy{width:170px}
.bigstars{font-size:clamp(3rem,12vw,4.6rem);letter-spacing:6px;color:var(--line)}
.bigstars .on{color:var(--yellow);text-shadow:0 3px 0 #C98A00;display:inline-block;animation:pop .5s backwards}
.bigstars .on:nth-child(2){animation-delay:.2s}.bigstars .on:nth-child(3){animation-delay:.4s}
.result h2{font-size:clamp(1.8rem,6vw,2.6rem)}
.result p{margin:0;font-weight:700;color:var(--muted);font-size:1.1rem}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50;width:100%;height:100%}

/* ---------- Players & ranking ---------- */
.err{margin:0;min-height:1.3em;color:var(--bad);font-weight:800}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;width:100%;max-width:820px}
.player{position:relative;display:grid}
.pbtn,.player.add{border:4px solid transparent;background:var(--card);border-radius:22px;padding:12px 8px 10px;box-shadow:0 5px 0 var(--line);display:grid;gap:4px;justify-items:center;align-content:start;transition:transform .12s}
.pbtn:active,.player.add:active{transform:translateY(3px)}
.pbtn:hover{border-color:var(--mc)}
.pbtn .pic{width:100%;max-width:96px}
.pbtn b,.player.add b{font-family:var(--display);font-size:1.15rem;font-weight:600;line-height:1.1;overflow-wrap:anywhere}
.pbtn small{color:var(--muted);font-weight:800;font-size:.82rem}
.pbtn small.code{font-family:var(--display);font-weight:600;color:var(--ink);background:var(--paper);border-radius:999px;padding:.1em .6em}
.pedit{position:absolute;top:6px;right:6px;width:38px;height:38px;border-radius:50%;border:0;background:var(--paper);font-size:1.05rem;box-shadow:0 2px 0 var(--line)}
.player.add{border:4px dashed var(--line);background:transparent;box-shadow:none;align-content:center;min-height:180px;color:var(--muted)}
.player.add .plus{font-family:var(--display);font-size:3rem;line-height:1;color:var(--purple)}
.recover{width:100%;max-width:560px;background:var(--card);border-radius:20px;padding:12px 16px;box-shadow:0 4px 0 var(--line);text-align:left}
.recover summary{font-family:var(--display);font-weight:600;font-size:1.1rem;cursor:pointer}
.recover .hint{text-align:left;margin:.5em 0}
.recrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.recrow input{font-family:var(--display);font-size:1.1rem;padding:.45em .7em;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);flex:1 1 150px;min-width:0}
.pill.code{background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.rtitle{font-size:clamp(1.5rem,5vw,2.1rem);font-weight:700}
.rtabs{justify-content:flex-start;margin-bottom:12px}
.ranklist{gap:8px}
.rrow{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:16px;background:var(--paper)}
.rrow.me{background:#FFF4D6;box-shadow:inset 0 0 0 3px var(--yellow)}
.rpos{font-family:var(--display);font-weight:700;font-size:1.5rem;min-width:2.2em;text-align:center}
.rpic{width:48px;flex:none}
.rname{flex:1;min-width:0;font-family:var(--display);font-weight:600;font-size:1.2rem;overflow-wrap:anywhere}
.rname em{font-style:normal;color:var(--muted);font-size:.9rem}
.rname small{display:block;font-family:var(--body);font-weight:800;color:var(--muted);font-size:.78rem}
.rstars{font-family:var(--display);font-weight:700;font-size:1.3rem;color:#B57A00;white-space:nowrap}
.rsep{text-align:center;color:var(--muted);font-weight:800}

/* ---------- Bonus games ---------- */
.bonusbar{display:grid;gap:16px;margin-bottom:16px}
.world.bonus{border-top:0;border-left:10px solid var(--c);background:linear-gradient(135deg,var(--card) 60%,#FFF4FA)}
.btag{margin-left:auto;font-family:var(--display);font-weight:600;font-size:.85rem;background:var(--c);color:#fff;border-radius:999px;padding:.2em .8em}
.bacts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:860px){.bacts{grid-template-columns:repeat(2,1fr)}}
@media (max-width:540px){.bacts{grid-template-columns:1fr}}
.explore{display:grid;grid-template-columns:260px 1fr;gap:16px;align-items:start}
@media (max-width:760px){.explore{grid-template-columns:1fr}}
.exinfo{position:-webkit-sticky;position:sticky;top:12px;justify-items:center;text-align:center}
@media (max-width:760px){.exinfo{position:static}}
.table100{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.tbtn{border:0;border-radius:10px;padding:0;height:clamp(30px,6.5vw,52px);font-family:var(--display);font-weight:600;font-size:clamp(.85rem,2.4vw,1.25rem);color:var(--ink);box-shadow:0 2px 0 var(--line);transition:transform .1s}
.tbtn.on{background:var(--c)!important;color:#fff;transform:scale(1.18);box-shadow:0 4px 0 rgba(20,30,60,.25);position:relative;z-index:1}
.tslice{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%;max-width:520px}
.tcell{height:clamp(30px,6vw,44px);border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:clamp(.85rem,2.4vw,1.2rem)}
.tcell.q{background:var(--card)!important;box-shadow:inset 0 0 0 3px var(--c);color:var(--c);font-size:1.4rem}
.choices.g100{gap:4px}
.choices.g100 .choice{min-height:0;height:clamp(30px,6vw,46px);padding:0;font-size:clamp(.8rem,2.4vw,1.15rem);border-width:2px;border-radius:9px;box-shadow:0 2px 0 var(--line)}
.seqgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:620px;width:100%;margin:0 auto}
.sbtn{border:0;border-radius:20px;height:clamp(64px,14vw,96px);font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,5vw,2.4rem);background:var(--card);color:var(--ink);box-shadow:0 6px 0 var(--line),inset 0 0 0 3px var(--line);transition:transform .1s}
.sbtn:active{transform:translateY(4px)}
.sbtn.done{background:var(--ok);color:#fff;box-shadow:0 6px 0 #17804D;opacity:.55}

/* ---------- Review with tips ---------- */
.tipbox{display:flex;gap:10px;align-items:flex-start;background:#FFF6D6;border-radius:18px;padding:12px 16px;box-shadow:inset 0 0 0 3px var(--yellow);font-weight:800;font-size:1.05rem;line-height:1.35;color:var(--ink)}
.tipbox b{font-family:var(--display);font-weight:600}
.tipicon{font-size:1.6rem;line-height:1}
.tipbox.pulse{animation:tippulse .6s}
@keyframes tippulse{30%{transform:scale(1.04);box-shadow:inset 0 0 0 5px var(--orange)}}

/* ---------- End-of-lesson celebration (each scene commits to its own look) ---------- */
.celebrate{position:fixed;inset:0;z-index:80;overflow:hidden;display:grid;place-items:center;cursor:pointer;animation:celin .45s ease-out;color:#fff}
.celebrate.out{animation:celout .4s forwards}
@keyframes celin{from{opacity:0;transform:scale(1.08)}}
@keyframes celout{to{opacity:0;transform:scale(.96)}}
.celebrate.stomp{animation:stomp .25s}
@keyframes stomp{30%{transform:translateY(6px)}60%{transform:translateY(-3px)}}
.cel-scene,.cel-fx{position:absolute;inset:0;pointer-events:none}
.cel-center{position:relative;display:grid;justify-items:center;gap:10px;text-align:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.cel-buddy{width:min(230px,52vw);animation:dance .5s ease-in-out infinite alternate;filter:drop-shadow(0 10px 18px rgba(0,0,0,.25))}
.cel-title{font-family:var(--display);font-weight:700;font-size:clamp(2rem,8vw,3.6rem);line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.25);animation:titlepop .7s cubic-bezier(.2,1.6,.4,1) .2s backwards;text-wrap:balance;max-width:16ch}
@keyframes titlepop{from{transform:scale(.2) rotate(-8deg);opacity:0}}
.celebrate .bigstars{color:rgba(255,255,255,.35)}
.cel-sub{font-weight:800;opacity:.85;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.4}}
.cel-fx .p{position:absolute;top:0;line-height:1;animation-iteration-count:infinite;animation-timing-function:linear}
.cel-fx .p.fall{top:-60px;animation-name:pfall}
.cel-fx .p.rise{top:auto;bottom:-60px;animation-name:prise}
.cel-fx .p.zoom{top:auto;bottom:auto;top:50%;animation-name:pzoom;animation-timing-function:ease-out}
@keyframes pfall{to{transform:translateY(115vh) rotate(360deg)}}
@keyframes prise{to{transform:translateY(-115vh) rotate(-200deg)}}
@keyframes pzoom{0%{transform:translate(0,0) scale(.2);opacity:0}15%{opacity:1}100%{transform:translate(calc((var(--dx,1) * 30vw)),-60vh) scale(1.4) rotate(220deg);opacity:0}}
.cel-fx .p.zoom:nth-child(odd){--dx:-1}
/* pop: stage with sweeping spotlights */
.th-pop{background:radial-gradient(ellipse at 50% 120%,#5B2BB5 0%,#2A1150 55%,#120726 100%)}
.th-pop .spot{position:absolute;top:-10%;width:34vw;height:120%;background:linear-gradient(rgba(255,240,200,.35),transparent 80%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);transform-origin:50% 0;animation:sweep 2.4s ease-in-out infinite alternate}
.th-pop .spot.l{left:5%;--a:-25deg;--b:20deg}.th-pop .spot.r{right:5%;--a:25deg;--b:-20deg;animation-delay:-1.2s;background:linear-gradient(rgba(240,122,184,.4),transparent 80%)}
@keyframes sweep{from{transform:rotate(var(--a))}to{transform:rotate(var(--b))}}
.th-pop .stage{position:absolute;left:0;right:0;bottom:0;height:16%;background:repeating-linear-gradient(90deg,#3B1C73 0 60px,#4A2390 60px 120px);box-shadow:0 -6px 30px rgba(201,168,255,.6)}
/* campo: sunset field */
.th-campo{background:linear-gradient(#FF9A5A 0%,#FFC970 45%,#9BD46A 46%,#6DB548 100%)}
.th-campo .sun{position:absolute;left:50%;top:18%;width:200px;height:200px;margin-left:-100px;border-radius:50%;background:#FFE27A;box-shadow:0 0 80px #FFE27A;animation:pulse 2s ease-in-out infinite}
.th-campo .fence{position:absolute;left:0;right:0;top:40%;height:60px;background:repeating-linear-gradient(90deg,#8A5A34 0 12px,transparent 12px 70px),linear-gradient(transparent 14px,#8A5A34 14px 22px,transparent 22px 40px,#8A5A34 40px 48px,transparent 48px)}
.th-campo .hatfly{position:absolute;left:-10%;top:30%;font-size:64px;animation:hatarc 3.2s ease-in-out infinite}
@keyframes hatarc{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(60vw,-25vh) rotate(360deg)}100%{transform:translate(120vw,0) rotate(720deg)}}
@keyframes pulse{50%{transform:scale(1.08)}}
/* futebol: stadium kick */
.th-futebol{background:linear-gradient(#1B3A6B 0%,#2C5BA8 40%,#2EA44F 41%,#23853F 100%)}
.th-futebol .field{position:absolute;left:0;right:0;bottom:0;height:59%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 80px,transparent 80px 160px)}
.th-futebol .goal{position:absolute;right:4%;bottom:22%;font-size:120px}
.th-futebol .kick{position:absolute;left:4%;bottom:14%;font-size:56px;animation:kick 2.6s cubic-bezier(.3,.6,.4,1) .3s infinite}
@keyframes kick{0%{transform:translate(0,0) rotate(0)}55%{transform:translate(78vw,-14vh) rotate(720deg)}70%,100%{transform:translate(80vw,-10vh) rotate(760deg);opacity:0}}
.th-futebol .gol{position:absolute;top:10%;left:0;right:0;text-align:center;font-family:var(--display);font-weight:700;font-size:clamp(2.5rem,12vw,6rem);color:#FFD84A;text-shadow:0 5px 0 #B37F00;animation:golpop 2.6s ease-out .3s infinite;opacity:0}
@keyframes golpop{0%,50%{opacity:0;transform:scale(.3)}60%{opacity:1;transform:scale(1.2)}90%{opacity:1;transform:scale(1)}100%{opacity:0}}
/* mar: underwater */
.th-mar{background:linear-gradient(#5ED3E8 0%,#1C9CC2 50%,#0E6C8F 100%)}
.th-mar .waves{position:absolute;left:0;bottom:0;width:200%;height:120px;animation:wave 6s linear infinite}
@keyframes wave{to{transform:translateX(-50%)}}
.th-mar .bubbles i{position:absolute;bottom:-40px;width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.7);animation:prise 6s linear infinite}
.th-mar .bubbles i:nth-child(odd){width:14px;height:14px}
.th-mar .bubbles i:nth-child(1){left:5%}.th-mar .bubbles i:nth-child(2){left:12%;animation-delay:-1s}.th-mar .bubbles i:nth-child(3){left:20%;animation-delay:-3s}.th-mar .bubbles i:nth-child(4){left:28%;animation-delay:-2s}.th-mar .bubbles i:nth-child(5){left:36%;animation-delay:-4s}.th-mar .bubbles i:nth-child(6){left:44%;animation-delay:-.5s}.th-mar .bubbles i:nth-child(7){left:52%;animation-delay:-2.5s}.th-mar .bubbles i:nth-child(8){left:60%;animation-delay:-5s}.th-mar .bubbles i:nth-child(9){left:68%;animation-delay:-1.5s}.th-mar .bubbles i:nth-child(10){left:76%;animation-delay:-3.5s}.th-mar .bubbles i:nth-child(11){left:84%;animation-delay:-4.5s}.th-mar .bubbles i:nth-child(12){left:92%;animation-delay:-.8s}.th-mar .bubbles i:nth-child(13){left:48%;animation-delay:-5.5s}.th-mar .bubbles i:nth-child(14){left:16%;animation-delay:-4.2s}
/* espaco: rocket launch */
.th-espaco{background:radial-gradient(ellipse at 30% 20%,#2A2F7A 0%,#0F1236 60%,#05061A 100%)}
.th-espaco .stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 1.6s ease-in-out infinite}
.th-espaco .stars i:nth-child(3n){animation-delay:-.6s}.th-espaco .stars i:nth-child(3n+1){animation-delay:-1.1s}
@keyframes twinkle{50%{opacity:.2}}
.th-espaco .planet{position:absolute;right:8%;top:12%;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFB86B,#E8559F);box-shadow:0 0 0 14px rgba(255,255,255,.08)}
.th-espaco .rocket{position:absolute;left:8%;bottom:-80px;font-size:72px;animation:launch 3s ease-in .2s infinite}
@keyframes launch{0%{transform:translate(0,0)}100%{transform:translate(70vw,-120vh)}}
/* ninja: moonlit night */
.th-ninja{background:linear-gradient(#1D1B3A 0%,#4B2C5E 60%,#E07A5F 100%)}
.th-ninja .moon{position:absolute;left:50%;top:10%;width:180px;height:180px;margin-left:-90px;border-radius:50%;background:#FFF3D6;box-shadow:0 0 60px rgba(255,243,214,.7)}
.th-ninja .shuriken{position:absolute;left:-60px;top:22%;width:56px;height:56px;animation:throw 1.8s linear infinite}
@keyframes throw{to{transform:translateX(120vw) rotate(1440deg)}}
/* cao: garden with paw trail */
.th-cao{background:linear-gradient(#9ED8FF 0%,#C8ECFF 55%,#7BCB5C 56%,#5FAF45 100%)}
.th-cao .paws{position:absolute;left:0;right:0;bottom:12%;display:flex;justify-content:space-around}
.th-cao .paws span{font-size:40px;opacity:0;animation:pawstep 4s infinite}
.th-cao .paws span:nth-child(odd){transform:translateY(-20px)}
.th-cao .paws span:nth-child(2){animation-delay:.3s}.th-cao .paws span:nth-child(3){animation-delay:.6s}.th-cao .paws span:nth-child(4){animation-delay:.9s}.th-cao .paws span:nth-child(5){animation-delay:1.2s}.th-cao .paws span:nth-child(6){animation-delay:1.5s}.th-cao .paws span:nth-child(7){animation-delay:1.8s}.th-cao .paws span:nth-child(8){animation-delay:2.1s}
@keyframes pawstep{0%{opacity:0}10%,70%{opacity:1}100%{opacity:0}}
/* fofo: pastel rainbow */
.th-fofo{background:linear-gradient(#FFD6EC 0%,#E9D7FF 60%,#CDEBFF 100%);color:#5B3FA8}
.th-fofo .cel-title{text-shadow:0 4px 0 #fff}
.th-fofo .rainbow{position:absolute;left:50%;bottom:-38vmin;width:110vmin;height:110vmin;margin-left:-55vmin;border-radius:50%;background:radial-gradient(circle,transparent 46%,#B9A2FF 46% 50%,#7FD3FF 50% 54%,#8BE3A0 54% 58%,#FFE27A 58% 62%,#FFB27A 62% 66%,#FF8FB8 66% 70%,transparent 70%);animation:pulse 3s ease-in-out infinite}
.th-fofo .cloud{position:absolute;width:180px;height:60px;border-radius:60px;background:#fff;box-shadow:40px -24px 0 6px #fff,90px 0 0 0 #fff}
.th-fofo .c1{left:6%;top:16%;animation:drift 22s linear infinite}.th-fofo .c2{left:60%;top:30%;animation:drift 30s linear infinite reverse}
/* dino: volcano */
.th-dino{background:linear-gradient(#FF8A3D 0%,#FFB45C 45%,#7A5230 46%,#5A3A1E 100%)}
.th-dino .volcano{position:absolute;right:4%;bottom:20%;font-size:clamp(90px,16vw,170px);animation:pulse 1.3s ease-in-out infinite}
.th-dino .ground{position:absolute;left:0;right:0;bottom:0;height:22%;background:repeating-linear-gradient(90deg,#4E3219 0 40px,#5A3A1E 40px 80px)}
/* robo: neon circuit */
.th-robo{background:#0B1530}
.th-robo .circuit{position:absolute;inset:0;background-image:linear-gradient(rgba(111,245,230,.18) 2px,transparent 2px),linear-gradient(90deg,rgba(111,245,230,.18) 2px,transparent 2px);background-size:46px 46px;animation:scan 2s linear infinite}
@keyframes scan{to{background-position:0 46px}}
.th-robo .gear{position:absolute;font-size:110px;animation:spin 4s linear infinite;opacity:.8}
.th-robo .g1{left:6%;top:10%}.th-robo .g2{right:6%;bottom:10%;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.tabchips{margin:2px 0 12px;gap:6px;align-items:center}
.tabchips .chip{padding:.4em .8em;min-width:2.6em}
.tablbl{font-family:var(--display);font-weight:600;color:var(--muted,#5B6785);margin-right:4px}
.tablist{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:540px){.tablist{grid-template-columns:1fr}}
.trowbtn{display:flex;justify-content:space-between;align-items:center;border:0;border-radius:16px;padding:.55em 1em;font-family:var(--display);font-weight:600;font-size:clamp(1.15rem,3vw,1.5rem);background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line),inset 0 0 0 3px var(--line);transition:transform .1s}
.trowbtn b{color:var(--c)}
.trowbtn.on{background:var(--c);color:#fff;transform:scale(1.04)}
.trowbtn.on b{color:#fff}
.tdots{display:flex;flex-direction:column;gap:4px;align-items:center;margin:8px 0}
.trow{display:flex;gap:4px;animation:tin .35s both;animation-delay:var(--d)}
@keyframes tin{from{opacity:0;transform:scale(.6)}}
.trow i{display:block;width:14px;height:14px;border-radius:50%;background:var(--c)}

.sixseven{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(30,40,67,.55);cursor:pointer;animation:ssin .25s both}
@keyframes ssin{from{opacity:0}}
.ss-title{font-family:var(--display);font-weight:700;font-size:clamp(2.6rem,11vw,5rem);color:var(--yellow);text-shadow:0 5px 0 #C9471F,0 8px 18px rgba(0,0,0,.35);margin-bottom:18px;animation:sswig .5s ease-in-out infinite alternate}
@keyframes sswig{from{transform:rotate(-5deg) scale(1)}to{transform:rotate(5deg) scale(1.08)}}
.ss-hands{display:flex;gap:min(12vw,70px)}
.ss-hand{display:flex;flex-direction:column;align-items:center;animation:ssup .45s ease-in-out infinite alternate}
.ss-hand.r{animation-delay:-.45s}
.ss-hand b{font-family:var(--display);font-weight:700;font-size:clamp(5rem,24vw,10rem);line-height:1;color:#fff;text-shadow:0 6px 0 var(--purple),0 10px 20px rgba(0,0,0,.3)}
.ss-hand i{display:block;width:clamp(110px,30vw,170px);height:clamp(110px,30vw,170px)}
@keyframes ssup{from{transform:translateY(36px) rotate(-7deg)}to{transform:translateY(-36px) rotate(7deg)}}

.plabel{font-family:var(--display);font-weight:600;color:var(--muted);margin:4px 0 -4px}
.pbtn.busy{opacity:.55;pointer-events:none}

/* login, wallet and parents' area */
.loginbox{width:100%;max-width:520px;justify-items:center;text-align:center}
.loginbox h2{margin:0;font-family:var(--display)}
.bigin{font-family:var(--display);font-size:1.4rem;padding:.4em .7em;border-radius:16px;border:3px solid var(--line);width:min(320px,100%);text-align:center;background:var(--card);color:var(--ink)}
.bigin.pin{letter-spacing:.5em;width:min(200px,100%)}
.dob{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.dob select{font-family:var(--display);font-size:1.2rem;padding:.45em .5em;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink);-webkit-appearance:none;appearance:none;text-align:center}
.reward{min-height:1.6em;margin:0;font-family:var(--display);font-weight:600;opacity:0;transition:opacity .3s}
.reward.on{opacity:1}
.gemup{display:inline-block;background:#D9F2FF;border-radius:999px;padding:.1em .6em;margin-right:4px;animation:pop .5s 2}
button.pill{border:0;cursor:pointer;box-shadow:0 3px 0 #9CC9E3}
.fcoin{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE58A,#F5B700 60%,#C98A00);color:#7A4A00;font-family:var(--display);font-weight:700;font-size:.85em;box-shadow:inset 0 0 0 2px #E0A100;vertical-align:-.15em}
.fcoin.big{font-size:1em}
.wtop{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:540px){.wtop{grid-template-columns:1fr}}
.wbal{justify-items:center;text-align:center;gap:4px}
.wbal .bignum{font-size:clamp(2.2rem,8vw,3.2rem)}
.wtrade,.wnote{text-align:center;justify-items:center}
.wrate{font-family:var(--display);font-weight:600;font-size:1.25rem}
.wbar{width:100%;height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.wbar i{display:block;height:100%;background:var(--c,var(--purple));border-radius:999px}
.exrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-top:2px solid var(--line)}
.exrow:first-of-type{border-top:0}
.exrow>span{display:flex;flex-direction:column;flex:1;min-width:0}
.exrow small{color:var(--muted);font-weight:600}
.exrow b{font-family:var(--display);white-space:nowrap}
.exbtns{flex-direction:row!important;flex:none!important;gap:6px}
.exbtns .btn{font-size:1rem;padding:.5em .9em}
.pend{box-shadow:0 8px 0 #F2C94C,inset 0 0 0 3px #F2C94C}
.parents{display:grid;gap:16px;max-width:900px;margin:0 auto}
.parents h3{margin:0;font-family:var(--display)}
.parents details summary{cursor:pointer;list-style:none}
.parents details summary::-webkit-details-marker{display:none}
.parents details summary h3::before{content:'▸ '}
.parents details[open] summary h3::before{content:'▾ '}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--card);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:1.7rem;color:var(--ink)}
.kpi span{font-weight:700;color:var(--ink)}
.kpi small{color:var(--muted);font-weight:600}
.kpi small.up{color:#17804D}
.kpi small.down{color:#B4233F}
.chart{margin:0;background:var(--card);border-radius:24px;padding:16px;box-shadow:0 6px 0 var(--line)}
.chart figcaption{font-family:var(--display);font-weight:600;margin-bottom:10px}
.bars{position:relative;display:flex;align-items:flex-end;height:150px;gap:2px;border-bottom:2px solid var(--line);padding-top:16px}
.bar{flex:1;height:100%;display:flex;align-items:flex-end;border:0;background:transparent;padding:0;cursor:pointer;min-width:0}
.bar i{display:block;width:100%;background:var(--purple);border-radius:4px 4px 0 0}
.bar:hover i,.bar.on i{background:#5B3AB8}
.bmax{position:absolute;top:0;left:0;font-size:.8rem;font-weight:700;color:var(--muted)}
.bx{position:relative;height:1.4em;font-size:.8rem;font-weight:700;color:var(--muted)}
.bx span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.btip{margin:6px 0 0;text-align:left}
.wprog{display:grid;gap:8px}
.wp{display:grid;grid-template-columns:minmax(0,1.3fr) 1fr auto;gap:10px;align-items:center;font-weight:600}
.wp span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wp small{color:var(--muted);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.rules{display:grid;gap:10px;margin-top:10px}
.rules label{display:grid;gap:4px;font-weight:700}
.rules input{font-family:var(--display);font-size:1.1rem;padding:.45em .7em;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink)}

/* shop */
.shoptop{display:grid;justify-items:center;text-align:center;gap:4px;margin-bottom:12px}
.shopme{width:150px}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sitem{background:var(--card);border-radius:20px;padding:10px;box-shadow:0 5px 0 var(--line);display:grid;justify-items:center;text-align:center;gap:4px}
.sitem.trying{box-shadow:0 5px 0 var(--pink),inset 0 0 0 3px var(--pink)}
.sitem.own{background:#F1FBF5}
.sitem small{color:var(--muted);font-weight:700}
.sprev{border:0;background:#F3F6FC;border-radius:16px;width:76px;height:76px;display:grid;place-items:center;cursor:pointer}
.semo{font-size:2.6rem;line-height:1}
.sswatch{width:46px;height:46px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#8B5CF6)}
.btn.small{font-size:.95rem;padding:.45em .8em;border-radius:14px}
.btn.small.on{background:var(--green);color:#fff}
.btn[disabled]{opacity:.55;cursor:default}
.char.skin-neon{-webkit-filter:drop-shadow(0 0 4px #29F5FF) drop-shadow(0 0 10px #FF3DF2);filter:drop-shadow(0 0 4px #29F5FF) drop-shadow(0 0 10px #FF3DF2)}
.sswatch.skin-neon{background:radial-gradient(circle,#29F5FF,#FF3DF2);box-shadow:0 0 10px #29F5FF,0 0 16px #FF3DF2}
.char.skin-dourada{-webkit-filter:sepia(1) saturate(3.2) hue-rotate(-12deg) brightness(1.08);filter:sepia(1) saturate(3.2) hue-rotate(-12deg) brightness(1.08)}
.sswatch.skin-dourada{background:radial-gradient(circle at 35% 30%,#FFF3B0,#E0A100)}
.char.skin-gelo{-webkit-filter:grayscale(1) sepia(.6) hue-rotate(165deg) saturate(3) brightness(1.18) drop-shadow(0 0 6px #9FE3FF);filter:grayscale(1) sepia(.6) hue-rotate(165deg) saturate(3) brightness(1.18) drop-shadow(0 0 6px #9FE3FF)}
.sswatch.skin-gelo{background:radial-gradient(circle at 35% 30%,#fff,#7FD3FF)}
.char.skin-fantasma{opacity:.6;-webkit-filter:grayscale(.7) brightness(1.2);filter:grayscale(.7) brightness(1.2);animation:ghost 2.4s ease-in-out infinite}
@keyframes ghost{50%{transform:translateY(-6px);opacity:.4}}
.sswatch.skin-fantasma{background:radial-gradient(circle at 35% 30%,#fff,#C9CED9);opacity:.8}
.char.skin-magico{animation:rainbow 3s linear infinite}
@keyframes rainbow{from{-webkit-filter:hue-rotate(0deg) saturate(1.4);filter:hue-rotate(0deg) saturate(1.4)}to{-webkit-filter:hue-rotate(360deg) saturate(1.4);filter:hue-rotate(360deg) saturate(1.4)}}
.sswatch.skin-magico{background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red);background-color:#FF6FB5}
.char.skin-galaxia{-webkit-filter:grayscale(.3) sepia(.7) hue-rotate(215deg) saturate(2.6) brightness(.95) drop-shadow(0 0 8px #8B5CF6);filter:grayscale(.3) sepia(.7) hue-rotate(215deg) saturate(2.6) brightness(.95) drop-shadow(0 0 8px #8B5CF6)}
.sswatch.skin-galaxia{background:radial-gradient(circle at 35% 30%,#C9A8FF,#2A1A6E)}
.char .acc-float{animation:accfloat 2s ease-in-out infinite}
@keyframes accfloat{50%{transform:translateY(-5px)}}
.char .acc-twinkle{animation:twinkle 1.4s ease-in-out infinite}
.char .acc-twinkle.d2{animation-delay:-.7s}
@keyframes twinkle{50%{opacity:.25}}
.char .acc-back{opacity:.9}
</style>

<div class="floaty" id="floaty" aria-hidden="true"></div>
<div class="wrap" id="app"></div>
<canvas id="confetti" hidden></canvas>
