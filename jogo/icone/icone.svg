<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ícone do Caderninho Mágico: caderno com uma conta e uma estrela mágica.
       Fundo inteiro (sem transparência) e o desenho dentro do círculo central de 80%,
       para servir como ícone "maskable" no Android e como apple-touch-icon no iOS. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#E8559F"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE58A"/>
      <stop offset="1" stop-color="#F5B700"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#2A1450" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- quadriculado de caderno no fundo -->
  <g stroke="#fff" stroke-opacity=".10" stroke-width="4">
    <path d="M0 128H1024M0 256H1024M0 384H1024M0 512H1024M0 640H1024M0 768H1024M0 896H1024"/>
    <path d="M128 0V1024M256 0V1024M384 0V1024M512 0V1024M640 0V1024M768 0V1024M896 0V1024"/>
  </g>
  <g transform="rotate(-6 512 540)" filter="url(#shadow)">
    <!-- página -->
    <rect x="262" y="236" width="520" height="610" rx="52" fill="#fff"/>
    <!-- linhas e margem -->
    <g stroke="#BFD6F5" stroke-width="7">
      <path d="M322 420H742M322 520H742M322 620H742M322 720H742"/>
    </g>
    <path d="M352 268V818" stroke="#F49AB8" stroke-width="6"/>
    <!-- espiral -->
    <g fill="#5B3AB8">
      <circle cx="262" cy="320" r="20"/><circle cx="262" cy="420" r="20"/><circle cx="262" cy="520" r="20"/>
      <circle cx="262" cy="620" r="20"/><circle cx="262" cy="720" r="20"/>
    </g>
    <g fill="none" stroke="#3B2780" stroke-width="12" stroke-linecap="round">
      <path d="M232 312q-28 8 -6 20"/><path d="M232 412q-28 8 -6 20"/><path d="M232 512q-28 8 -6 20"/>
      <path d="M232 612q-28 8 -6 20"/><path d="M232 712q-28 8 -6 20"/>
    </g>
    <!-- a conta -->
    <text x="560" y="640" text-anchor="middle" font-family="Fredoka, 'Baloo 2', sans-serif" font-weight="700" font-size="250" fill="#7C3AED" letter-spacing="-6">1+2</text>
  </g>
  <!-- estrela mágica com brilhos -->
  <g transform="translate(742 282) rotate(12)">
    <path d="M0 -118 L34 -36 L122 -30 L54 26 L76 112 L0 64 L-76 112 L-54 26 L-122 -30 L-34 -36 Z" fill="url(#star)" stroke="#fff" stroke-width="16" stroke-linejoin="round"/>
  </g>
  <g fill="#fff">
    <path d="M846 470l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/>
    <path d="M610 168l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z"/>
    <path d="M206 840l8 20 20 8 -20 8 -8 20 -8 -20 -20 -8 20 -8z" fill-opacity=".85"/>
  </g>
</svg>
